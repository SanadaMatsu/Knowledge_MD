# プロジェクト情報 入力スキーマ定義

# このファイルは2つの用途で使用します:
#  1. エージェントがヒアリングで収集すべき情報の定義リファレンス
#  2. 構造化入力モード時にユーザーが記入するテンプレート
#
# 使い方:
#   このファイルをコピーし、各フィールドに値を入力してエージェントに添付してください。
#   入力しない任意項目は null のままにしてください。

# -----------------------------------------------------------------------
# プロジェクト基本情報
# -----------------------------------------------------------------------
project:
  name: ""                  # [必須] プロジェクト名 例: "ECサイトリニューアル"
  description: ""           # [任意] プロジェクト概要（1〜3文程度）

# -----------------------------------------------------------------------
# 開発フェーズ
# -----------------------------------------------------------------------
development_phase:
  primary: ""               # [必須] 現在のメインフェーズ
                            #   選択肢: requirements / design / implementation / testing / maintenance

  phases_included:          # [任意] 今後含まれるフェーズ (複数選択可)
    - ""                    #   選択肢: requirements / design / implementation / testing / maintenance

  phase_notes: null         # [任意] フェーズに関する補足
                            #   例: "現在は保守フェーズだが、来期に機能追加を予定"

# -----------------------------------------------------------------------
# 技術スタック
# -----------------------------------------------------------------------
tech_stack:
  primary_languages:        # [必須] 主要プログラミング言語 (複数可)
    - ""                    #   例: TypeScript, Python, Java, Go, Rust, C#

  frameworks:               # [任意] 使用フレームワーク
    - ""                    #   例: Next.js, Django, Spring Boot, .NET, FastAPI

  cloud_provider: null      # [任意] 主要クラウドプロバイダー
                            #   選択肢: AWS / GCP / Azure / オンプレ / ハイブリッド / なし

  infrastructure: null      # [任意] インフラ・CI/CD の補足
                            #   例: "ECS + GitHub Actions", "オンプレKubernetes"

# -----------------------------------------------------------------------
# 開発環境
# -----------------------------------------------------------------------
development_environment:
  primary_ide: ""           # [必須] チームのメイン IDE / エディタ
                            #   例: VS Code / JetBrains系 / Visual Studio / Vim / 混在

  ide_notes: null           # [任意] IDE に関する補足
                            #   例: "メンバーによって VS Code と IntelliJ が混在"

  os: null                  # [任意] 開発環境 OS
                            #   選択肢: Windows / macOS / Linux / 混在

# -----------------------------------------------------------------------
# チーム情報
# -----------------------------------------------------------------------
team:
  size: null                # [必須] エンジニア人数（数字）
                            #   例: 3

  size_category: ""         # [任意] 規模感を選択
                            #   選択肢: solo(1名) / small(2〜5名) / medium(6〜20名) / large(21〜100名) / enterprise(100名超)

  experience_level: ""      # [必須] チーム全体のAIツール経験レベル
                            #   選択肢: beginner(未経験) / basic(基礎あり) / intermediate(業務使用経験あり) / advanced(活用推進済み)

  experience_notes: null    # [任意] 経験に関する補足
                            #   例: "シニアメンバーは Copilot 経験あり、ジュニアは未経験"

# -----------------------------------------------------------------------
# 主な目的・用途
# -----------------------------------------------------------------------
use_cases:                  # [必須] AIツールに期待する用途 (複数選択可)
  - ""                      #   選択肢:
                            #     code_completion       : コード補完・入力補助
                            #     code_generation       : コード生成（関数・クラス単位）
                            #     chat_qanda            : コードに関する質疑応答
                            #     test_generation       : テストコード自動生成
                            #     documentation         : ドキュメント・コメント生成
                            #     code_review           : コードレビュー支援
                            #     refactoring           : リファクタリング支援
                            #     bug_fix               : バグ修正支援
                            #     autonomous_tasks      : 自律タスク実行（Issue → PR 等）
                            #     security_scan         : セキュリティ脆弱性スキャン
                            #     code_transformation   : 大規模コード変換・マイグレーション

# -----------------------------------------------------------------------
# セキュリティ・コンプライアンス要件
# -----------------------------------------------------------------------
security:
  code_send_to_cloud: null  # [必須] コードをクラウドに送信することを許可するか
                            #   選択肢: allowed / restricted / prohibited

  onpremise_required: null  # [必須] オンプレミス・エアギャップ環境での動作が必要か
                            #   選択肢: true / false

  compliance_standards:     # [任意] 適用されるコンプライアンス基準
    - null                  #   例: ISO27001 / SOC2 / PCI-DSS / HIPAA / 社内セキュリティポリシー

  data_sensitivity: ""      # [任意] 扱うデータの機密性レベル
                            #   選択肢: public / internal / confidential / strictly_confidential

  security_notes: null      # [任意] その他セキュリティ要件の補足

# -----------------------------------------------------------------------
# 予算・ライセンス方針
# -----------------------------------------------------------------------
budget:
  model: ""                 # [必須] 予算方針
                            #   選択肢: free_only / limited(月額数千円/人まで) / standard(〜$20/人/月) / flexible(コスト効果次第)

  per_user_monthly_usd: null # [任意] 1ユーザーあたりの月額上限（USD）
                             #   例: 20

  procurement_notes: null   # [任意] 調達・契約に関する制約
                            #   例: "エンタープライズ契約のみ可", "OSS 優先方針あり"

# -----------------------------------------------------------------------
# 現状・課題
# -----------------------------------------------------------------------
current_situation:
  existing_tools:           # [任意] 現在使用中のAIツール
    - null                  #   例: GitHub Copilot / ChatGPT / なし

  main_pain_points:         # [任意] 現在の開発上の課題・ボトルネック
    - null                  #   例: "テスト作成に時間がかかりすぎる"
                            #       "コードレビューの負荷が高い"
                            #       "新メンバーのキャッチアップが遅い"

  additional_notes: null    # [任意] その他、エージェントに伝えたい情報
